<div class="music-analytics-container">
  <div class="analytics-wrapper">
    <div class="analytics-header">
      <h1 class="display-6 text-white">
        <i class="fas fa-chart-line me-3 text-success"></i>
        Music Analytics Dashboard
      </h1>
      <p class="lead text-white mb-0">Deep insights into your collection of <span class="text-success">{{
          songsData.length }}</span> songs</p>

      <!-- Tab Navigation -->
       <div class="tab-container">
         <ul class="tab-group">
           @for (tab of tabs; track tab) {
             <li class="tab" [routerLink]="tab.routes" [routerLinkActive]="'active'">
               <i [class]="tab.iconClass"></i>
               <span class="tab-label">{{ tab.name | titlecase }}</span>
             </li>
           }
         </ul>
       </div>
    </div>
    <div class="tab-content">
      <router-outlet></router-outlet>
    </div>
</div>
